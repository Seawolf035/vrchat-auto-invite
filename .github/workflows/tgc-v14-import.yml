name: Diagnose TGC v14 payload

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/tgc-v14-import.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diagnose payload
        shell: bash
        run: |
          set -u
          : > /tmp/tgc_v14.b64
          cat .github/tgc-v14-payload/p00.b64 >> /tmp/tgc_v14.b64
          head -c 8000 .github/tgc-v14-payload/p01.b64 >> /tmp/tgc_v14.b64
          cat .github/tgc-v14-payload/p02.b64 .github/tgc-v14-payload/p03.b64 .github/tgc-v14-payload/p04.b64 .github/tgc-v14-payload/p05.b64 .github/tgc-v14-payload/p06.b64 >> /tmp/tgc_v14.b64
          head -c 9000 .github/tgc-v14-payload/p07.b64 >> /tmp/tgc_v14.b64
          cat .github/tgc-v14-payload/p08.b64 >> /tmp/tgc_v14.b64
          head -c 9000 .github/tgc-v14-payload/p09.b64 >> /tmp/tgc_v14.b64
          cat .github/tgc-v14-payload/p10.b64 >> /tmp/tgc_v14.b64
          {
            echo "size=$(wc -c < /tmp/tgc_v14.b64)"
            echo "b64_sha256=$(sha256sum /tmp/tgc_v14.b64 | cut -d' ' -f1)"
            if base64 --decode /tmp/tgc_v14.b64 > /tmp/tgc_v14.zip 2>/tmp/base64.err; then
              echo "decode=ok"
              echo "zip_size=$(wc -c < /tmp/tgc_v14.zip)"
              echo "zip_sha256=$(sha256sum /tmp/tgc_v14.zip | cut -d' ' -f1)"
              if unzip -t /tmp/tgc_v14.zip >/tmp/unzip.out 2>&1; then
                echo "unzip=ok"
              else
                echo "unzip=failed"
              fi
            else
              echo "decode=failed"
            fi
          } > .github/tgc-v14-diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/tgc-v14-diagnostic.txt
          git commit -m "Record TGC v14 payload diagnostics" || true
          git push
