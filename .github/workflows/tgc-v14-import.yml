name: Import TGC v14 launcher

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/tgc-v14-import.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import launcher source
        shell: bash
        run: |
          set -euo pipefail
          cat .github/tgc-v14-payload/p00.b64 .github/tgc-v14-payload/p01.b64 .github/tgc-v14-payload/p02.b64 .github/tgc-v14-payload/p03.b64 .github/tgc-v14-payload/p04.b64 .github/tgc-v14-payload/p05.b64 .github/tgc-v14-payload/p06.b64 .github/tgc-v14-payload/p07.b64 .github/tgc-v14-payload/p08.b64 .github/tgc-v14-payload/p09.b64 .github/tgc-v14-payload/p10.b64 > /tmp/tgc_v14.b64
          test "$(wc -c < /tmp/tgc_v14.b64)" -eq 92388
          base64 --decode /tmp/tgc_v14.b64 > /tmp/tgc_v14.zip
          unzip -t /tmp/tgc_v14.zip
          rm -rf /tmp/tgc_v14
          mkdir -p /tmp/tgc_v14 AutoInviteApp
          unzip -q /tmp/tgc_v14.zip -d /tmp/tgc_v14
          cp -a /tmp/tgc_v14/. AutoInviteApp/
          rm -f AutoInviteApp/vrchat_auto_invite.log
          rm -rf AutoInviteApp/plugins/__pycache__
          rm -rf .github/tgc-v14-upload
          rm -rf .github/tgc-v14-payload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update TGC fork to v14 distributed node build"
          git push
